<!DOCTYPE html>
<html>

<head>
    <title>Student Management</title>
</head>

<body>

    <h2>Student List</h2>
    <a href="{% url 'student_create' %}">
        Add Student
    </a>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone }}</td>
            <td>{{ student.course }}</td>

            <td>
                <a href="{% url 'student_update' student.id %}">
                    Edit
                </a>
                  |
                <a href="{% url 'student_delete' student.id %}">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="6">No students found.</td>
        </tr>
        {% endfor %}

    </table>


</body>

</html>
